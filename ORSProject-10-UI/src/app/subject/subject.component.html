<br><br><br>
<div class="row " style="padding-top: 3%; padding-bottom:13%;
background: url(assets/files/wall.jpg) no-repeat center center;
background-attachment: fixed;
background-size: cover;width:auto;
height: auto;">

  <div class="col-sm-4"></div>

  <div class="col-sm-4">
    <div class="card">
      <div class="card-body shadow-lg grad">

        <form>

          <!-- Heading -->
          <h2 *ngIf="!form.data.id" class="text-primary font-weight-bold text-center">Add Subject</h2>
          <h2 *ngIf="form.data.id>0" class="text-primary font-weight-bold text-center">Update Subject</h2>

          <!-- Alerts -->
          <div *ngIf="form.error && form.message != null" class="alert alert-danger alert-dismissible">
            <button type="button" class="close" data-dismiss="alert">&times;</button>
            {{form.message}}
          </div>

          <div *ngIf="!form.error && form.message != null" class="alert alert-success alert-dismissible">
            <button type="button" class="close" data-dismiss="alert">&times;</button>
            {{form.message}}
          </div>

          <!-- Subject Name -->
          <div style="padding-top:3%">
            <b>Subject Name</b>
            <div class="col-sm-12">
              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text">
                    <i class="fa fa-file grey-text"></i>
                  </div>
                </div>
                <input type="text" name="subjectName" [(ngModel)]="form.data.subjectName" class="form-control"
                  placeholder="Enter Subject Name">
              </div>
            </div>
            <span class="alertRedColor"> {{form.inputerror.subjectName}} </span>
          </div>

          <!-- Description -->
          <div style="padding-top:3%">
            <b>Description</b>
            <div class="col-sm-12">
              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text">
                    <i class="fa fa-bars grey-text"></i>
                  </div>
                </div>
                <textarea class="form-control" name="description" [(ngModel)]="form.data.description"
                  placeholder="Enter Description"></textarea>
              </div>
            </div>
            <span class="alertRedColor"> {{form.inputerror.description}} </span>
          </div>

          <!-- Course Dropdown -->
          <div style="padding-top:3%">
            <b>Course</b>
            <div class="col-sm-12">
              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text">
                    <i class="fa fa-bars grey-text"></i>
                  </div>
                </div>
                <select class="form-control" name="courseId" [(ngModel)]="form.data.courseId" style="cursor: pointer;">
                  <option *ngFor="let obj of form.preload.courseList" [value]="obj.key">
                    {{obj.value}}
                  </option>
                </select>
              </div>
            </div>
          </div>

          <!-- Buttons Center -->
          <div class="row pt-3 pb-3">
            <div class="col text-center">

              <button *ngIf="!form.data.id" (click)="submit()" class="btn btn-success mr-2">
                Save
              </button>

              <button *ngIf="form.data.id>0" (click)="submit()" class="btn btn-success mr-2">
                Update
              </button>

              <button (click)="forward('/subjectlist')" type="button" class="btn btn-warning">
                List
              </button>

            </div>
          </div>

        </form>

      </div>
    </div>
  </div>
  <br><br><br>
</div>
