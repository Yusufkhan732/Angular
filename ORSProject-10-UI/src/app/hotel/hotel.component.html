```html
<br><br><br>

<style>
    .grad {
        background-image: linear-gradient(to bottom right,
                rgb(32, 168, 168),
                rgb(219, 231, 237));
        background-repeat: no-repeat;
        background-size: 100%;
        padding-bottom: 25px;
    }
</style>

<div class="row" style="padding-top: 3%; padding-bottom:15%;
  background: url(assets/files/wall.jpg) no-repeat center center;
  background-attachment: fixed;
  background-size: cover; width:auto; height:auto;">

    <div class="col-sm-4"></div>

    <div class="col-sm-4">
        <div class="card">
            <div class="card-body shadow-lg grad">

                <form>

                    <h2 *ngIf="!form.data.id" class="text-primary font-weight-bold text-center">
                        Add Hotel Room
                    </h2>

                    <h2 *ngIf="form.data.id > 0" class="text-primary font-weight-bold text-center">
                        Update Hotel Room
                    </h2>

                    <div *ngIf="form.error && form.message != null" class="alert alert-danger alert-dismissible">

                        <button type="button" class="close" data-dismiss="alert">
                            &times;
                        </button>

                        {{form.message}}
                    </div>

                    <div *ngIf="!form.error && form.message != null" class="alert alert-success alert-dismissible">

                        <button type="button" class="close" data-dismiss="alert">
                            &times;
                        </button>

                        {{form.message}}
                    </div>

                    <!-- Room No -->

                    <div style="padding-top:3%">
                        <span class="pt-2">
                            <b>Room No</b>
                            <span class="required-field"></span>
                        </span>

                        <div class="col-sm-12">
                            <div class="input-group">

                                <div class="input-group-prepend">
                                    <div class="input-group-text">
                                        <i class="fa fa-bed"></i>
                                    </div>
                                </div>

                                <input type="text" name="roomNo" [(ngModel)]="form.data.roomNo" class="form-control"
                                    placeholder="Enter Room Number">
                            </div>
                        </div>

                        <span style="color:red">
                            {{form.inputerror.roomNo}}
                        </span>
                    </div>

                    <!-- Room Type -->

                    <div style="padding-top:3%">
                        <span class="pt-2">
                            <b>Room Type</b>
                            <span class="required-field"></span>
                        </span>

                        <div class="col-sm-12">
                            <div class="input-group">

                                <div class="input-group-prepend">
                                    <div class="input-group-text">
                                        <i class="fa fa-building"></i>
                                    </div>
                                </div>

                                <input type="text" name="roomType" [(ngModel)]="form.data.roomType" class="form-control"
                                    placeholder="Enter Room Type">
                            </div>
                        </div>

                        <span style="color:red">
                            {{form.inputerror.roomType}}
                        </span>
                    </div>

                    <!-- Price -->

                    <div style="padding-top:3%">
                        <span class="pt-2">
                            <b>Price</b>
                            <span class="required-field"></span>
                        </span>

                        <div class="col-sm-12">
                            <div class="input-group">

                                <div class="input-group-prepend">
                                    <div class="input-group-text">
                                        <i class="fa fa-money"></i>
                                    </div>
                                </div>

                                <input type="number" name="price" [(ngModel)]="form.data.price" class="form-control"
                                    placeholder="Enter Room Price">
                            </div>
                        </div>

                        <span style="color:red">
                            {{form.inputerror.price}}
                        </span>
                    </div>

                    <!-- Status -->

                    <div style="padding-top:3%">
                        <span class="pt-2">
                            <b>Status</b>
                            <span class="required-field"></span>
                        </span>

                        <div class="col-sm-12">
                            <div class="input-group">

                                <div class="input-group-prepend">
                                    <div class="input-group-text">
                                        <i class="fa fa-check-circle"></i>
                                    </div>
                                </div>

                                <select class="form-control" name="status" [(ngModel)]="form.data.status">
                                    <option value="undefined">Select Option </option>
                                    <option value="Booked">Booked</option>
                                    <option value="Available">Available</option>


                                </select>
                            </div>
                        </div>

                        <span style="color:red">
                            {{form.inputerror.status}}
                        </span>
                    </div>

                    <!-- Buttons -->

                    <div class="row pt-4 justify-content-center">

                        <div class="col-auto">

                            <button *ngIf="!form.data.id" (click)="submit()" class="btn btn-success mr-3">
                                Save
                            </button>

                            <button *ngIf="form.data.id > 0" (click)="submit()" class="btn btn-success mr-3">
                                Update
                            </button>

                            <button (click)="forward('/hotellist')" type="button" class="btn btn-warning">
                                List
                            </button>

                        </div>

                    </div>

                </form>

            </div>
        </div>
    </div>

    <div class="col-sm-4"></div>

</div>
```
