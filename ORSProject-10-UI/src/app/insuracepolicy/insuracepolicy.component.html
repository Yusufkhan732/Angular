<br><br><br>
<style>
    .grad {
        background-image: linear-gradient(to bottom right, rgb(32, 168, 168), rgb(219, 231, 237));
        background-repeat: no-repeat;
        background-size: 100%;
        padding-bottom: 25px;
    }
</style>

<div class="row" style="padding-top: 3%; padding-bottom:15%;
background: url(assets/files/wall.jpg) no-repeat center center;
background-attachment: fixed;
background-size: cover; width:auto; height:auto;">

    <div class="col-sm-4"></div>
    <div class="col-sm-4">
        <div class="card">
            <div class="card-body shadow-lg grad">
                <form>
                    <h2 *ngIf="!form.data.id" class="text-primary font-weight-bold" style="text-align:center;">Add
                        Insurance</h2>
                    <h2 *ngIf="form.data.id>0" class="text-primary font-weight-bold" style="text-align:center;">Update
                        Insurance</h2>

                    <div *ngIf="form.error && form.message != null" class="alert alert-danger alert-dismissible">
                        <button type="button" class="close" data-dismiss="alert">&times;</button>
                        {{form.message}}
                    </div>
                    <div *ngIf="!form.error && form.message != null" class="alert alert-success alert-dismissible">
                        <button type="button" class="close" data-dismiss="alert">&times;</button>
                        {{form.message}}
                    </div>

                    <div style="padding-top:3%">
                        <span class="pt-2"><b>PolicyNumber</b><span class="required-field"></span></span>
                        <div class="col-sm-12">
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <div class="input-group-text"><i class="fa fa-file grey-text"></i></div>
                                </div>
                                <input type="text" name="policyNumber" [(ngModel)]="form.data.policyNumber"
                                    class="form-control" placeholder="Enter Course Name">
                            </div>
                        </div>
                        <span style="color: red;">{{form.inputerror.policyNumber}}</span>
                    </div>



                    <div style="padding-top:3%">
                        <span class="pt-2"><b>HolderName</b><span class="required-field"></span></span>
                        <div class="col-sm-12">
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <div class="input-group-text"><i class="fa fa-bars grey-text"></i></div>
                                </div>
                                <textarea class="form-control" placeholder="Enter Description" name="holderName"
                                    [(ngModel)]="form.data.holderName"></textarea>
                            </div>
                        </div>
                    </div>
                    <span style="color: red;">{{form.inputerror.holderName}}</span>

                    <div style="padding-top:3%">
                        <span class="pt-2"><b>PremiumAmount</b><span class="required-field"></span></span>
                        <div class="col-sm-12">
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <div class="input-group-text"><i class="fa fa-bars grey-text"></i></div>
                                </div>
                                <textarea class="form-control" placeholder="Enter Description" name="premiumAmount"
                                    [(ngModel)]="form.data.premiumAmount"></textarea>
                            </div>
                        </div>
                    </div>
                    <span style="color: red;">{{form.inputerror.premiumAmount}}</span>

                    <div style="padding-top:3%">
                        <span class="pt-2"><b>PolicyType</b><span class="required-field"></span></span>
                        <div class="col-sm-12">
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <div class="input-group-text"><i class="fa fa-bars grey-text"></i></div>
                                </div>
                                <textarea class="form-control" placeholder="Enter Description" name="policyType"
                                    [(ngModel)]="form.data.policyType"></textarea>
                            </div>
                        </div>
                    </div>
                    <span style="color: red;">{{form.inputerror.policyType}}</span>


                    <div class="row pt-3 justify-content-center">
                        <div class="col-auto">
                            <button *ngIf="!form.data.id" (click)="submit()" class="btn btn-success mr-3">Save</button>
                            <button *ngIf="form.data.id>0" (click)="submit()"
                                class="btn btn-success mr-4">Update</button>
                            <button (click)="forward('/Insuracepolicylist')" type="button"
                                class="btn btn-warning">List</button>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>
    <br><br>
</div>
